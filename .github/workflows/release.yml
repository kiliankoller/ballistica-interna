# Builds the installers for macOS, Windows and Linux: on a version tag (v*), once all three builds are green, they are
# attached to a draft release (title and text are entered by hand, then the release is published); when started by
# hand they are kept as workflow artifacts. Installers have no certificate (macOS: ad hoc signature).
name: Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 (Visual Studio 2022): on windows-latest (Visual Studio 2026) pnpm install fails, with pnpm 8 and
        # still with pnpm 10 (run 43836294979, 2026-11-16)
        os: [macos-latest, windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      # pnpm version from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: Checks
        run: |
          pnpm typecheck
          pnpm test
          pnpm test:data

      - name: Master data and licence notices
        run: |
          pnpm data
          pnpm notices

      - name: Installer
        env:
          # no certificate: no code signing identity is looked for (macOS is signed ad hoc by electron-builder.yml)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm --filter @ballistica-interna/desktop exec electron-vite build
          pnpm --filter @ballistica-interna/desktop exec electron-builder --publish never

      - name: Checksums (SHA-256)
        shell: bash
        run: |
          cd apps/desktop/dist
          if command -v sha256sum >/dev/null 2>&1; then sum='sha256sum'; else sum='shasum -a 256'; fi
          for f in *.dmg *.exe *.AppImage; do
            if [ -f "$f" ]; then $sum "$f"; fi
          done > "SHA256SUMS-${{ matrix.os }}.txt"
          cat "SHA256SUMS-${{ matrix.os }}.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/SHA256SUMS-*.txt
          if-no-files-found: error

  # one job after all three builds: a release appears only with every installer, and as a draft, so it is not public
  # before its text is in
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*

      - name: Next step
        run: |
          {
            echo "### Draft release ${GITHUB_REF_NAME} created"
            echo
            echo "Not public yet. Enter title and text (docs/RELEASE.md) and publish:"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Draft release ${GITHUB_REF_NAME}::Not public yet: enter title and text (docs/RELEASE.md), then publish."
